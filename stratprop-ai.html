<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StratProp - AI-Powered Property Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #1e3a3a;
  --gold: #d4a574;
  --cream: #f5f1ed;
  --text: #3e3935;
  --green: #27ae60;
  --blue: #3498db;
}
body {
  font-family: 'Lora', serif;
  background: var(--cream);
  color: var(--text);
  line-height: 1.6;
}
.header {
  background: var(--navy);
  color: white;
  padding: 30px 40px;
  border-bottom: 3px solid var(--gold);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 700;
}
.logo span { color: var(--gold); }
.header-buttons button {
  background: var(--gold);
  color: var(--navy);
  border: none;
  padding: 10px 20px;
  border-radius: 4px;
  margin-left: 10px;
  cursor: pointer;
  font-weight: 600;
  font-family: 'Lora', serif;
}
.header-buttons button:hover { background: #e8c5a0; }
.container {
  max-width: 1200px;
  margin: 40px auto;
  padding: 0 20px;
}
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  border-bottom: 2px solid var(--gold);
}
.tab-btn {
  padding: 12px 24px;
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
  font-family: 'Lora', serif;
  font-size: 14px;
  transition: all 0.3s;
}
.tab-btn.active {
  border-bottom-color: var(--gold);
  color: var(--gold);
}
.tab-btn:hover { color: var(--gold); }
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}
.section {
  background: white;
  border: 2px solid var(--gold);
  border-radius: 8px;
  padding: 30px;
  margin-bottom: 30px;
}
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  color: var(--navy);
  margin-bottom: 20px;
  border-bottom: 2px solid var(--gold);
  padding-bottom: 10px;
}
.upload-area {
  background: #faf8f5;
  border: 2px dashed var(--gold);
  border-radius: 8px;
  padding: 30px;
  text-align: center;
  margin-bottom: 20px;
  cursor: pointer;
}
.upload-area input { display: none; }
.upload-btn {
  background: var(--gold);
  color: var(--navy);
  padding: 12px 24px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
  font-family: 'Lora', serif;
}
.upload-btn:hover { background: #e8c5a0; }
.filter-section {
  background: #faf8f5;
  border: 1px solid var(--gold);
  padding: 15px;
  border-radius: 8px;
  margin: 20px 0;
}
.filter-title {
  font-weight: 600;
  margin-bottom: 12px;
  font-size: 12px;
  text-transform: uppercase;
}
.filters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 15px;
}
.filter-input {
  padding: 10px;
  border: 1px solid var(--gold);
  border-radius: 4px;
  font-family: 'Lora', serif;
  font-size: 13px;
}
.mls-list {
  border: 1px solid var(--gold);
  border-radius: 8px;
  max-height: 500px;
  overflow-y: auto;
  margin-top: 15px;
}
.mls-item {
  padding: 12px;
  border-bottom: 1px solid #e8e3de;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.mls-item:hover { background: #f5f1ed; }
.mls-item.selected {
  background: rgba(212, 165, 116, 0.2);
  border-left: 4px solid var(--gold);
}
.mls-info {
  flex: 1;
}
.mls-address {
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 4px;
  font-size: 14px;
}
.mls-details {
  font-size: 11px;
  color: #6b6560;
}
.mls-price {
  font-weight: 700;
  color: var(--gold);
  font-size: 16px;
}
.analysis-section {
  background: linear-gradient(135deg, #f5f1ed 0%, #fbfaf7 100%);
  border: 2px solid var(--gold);
  padding: 30px;
  border-radius: 8px;
  margin-bottom: 30px;
  display: none;
}
.analysis-section.show { display: block; }
.ai-button-container {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}
.ai-button {
  background: linear-gradient(135deg, var(--blue) 0%, #2980b9 100%);
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-family: 'Lora', serif;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s;
}
.ai-button:hover {
  background: linear-gradient(135deg, #2980b9 0%, #1f618d 100%);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
}
.ai-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}
.ai-spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.ai-results {
  background: rgba(52, 152, 219, 0.05);
  border: 2px solid var(--blue);
  padding: 20px;
  border-radius: 8px;
  margin: 20px 0;
  display: none;
}
.ai-results.show { display: block; }
.ai-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
  font-weight: 600;
  color: var(--blue);
}
.ai-insight {
  background: white;
  padding: 15px;
  border-radius: 4px;
  margin-bottom: 10px;
  border-left: 4px solid var(--blue);
}
.ai-insight-title {
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 5px;
}
.ai-insight-text {
  font-size: 13px;
  color: #6b6560;
  line-height: 1.6;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}
.stat-card {
  background: white;
  border: 1px solid var(--gold);
  padding: 20px;
  border-radius: 8px;
  text-align: center;
}
.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  color: #6b6560;
  margin-bottom: 8px;
  font-weight: 600;
}
.stat-value {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--navy);
}
.comps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}
.comp-card {
  background: white;
  border: 1px solid var(--gold);
  padding: 15px;
  border-radius: 8px;
}
.comp-address {
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 12px;
  font-size: 13px;
}
.comp-detail {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 12px;
  border-bottom: 1px solid #e8e3de;
}
.comp-detail span:first-child {
  color: #6b6560;
  font-weight: 600;
}
.comp-detail span:last-child {
  color: var(--navy);
  font-weight: 500;
}
.comp-price {
  font-weight: 700;
  color: var(--gold);
  font-size: 16px;
  margin-top: 10px;
  text-align: right;
  border-top: 2px solid var(--gold);
  padding-top: 10px;
}
.pricing-section {
  background: rgba(212, 165, 116, 0.1);
  border: 2px solid var(--gold);
  padding: 25px;
  border-radius: 8px;
  margin-bottom: 30px;
}
.pricing-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 20px;
}
.price-card {
  text-align: center;
  background: white;
  padding: 20px;
  border-radius: 4px;
  border: 1px solid var(--gold);
}
.price-tier {
  font-size: 11px;
  text-transform: uppercase;
  font-weight: 700;
  color: #6b6560;
  margin-bottom: 10px;
}
.price-amount {
  font-size: 26px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 8px;
}
.price-desc {
  font-size: 11px;
  color: #6b6560;
  line-height: 1.4;
}
.export-buttons {
  display: flex;
  gap: 10px;
  margin-top: 30px;
}
.export-buttons button {
  background: var(--gold);
  color: var(--navy);
  border: none;
  padding: 12px 20px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
  font-family: 'Lora', serif;
}
.export-buttons button:hover { background: #e8c5a0; }
.export-buttons button:disabled {
  background: #ccc;
  cursor: not-allowed;
}
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--navy);
  color: white;
  padding: 15px 20px;
  border-radius: 4px;
  display: none;
  z-index: 2000;
  border: 1px solid var(--gold);
}
.toast.show { display: block; }
.status-msg {
  background: #faf8f5;
  border: 1px solid var(--gold);
  padding: 15px;
  border-radius: 4px;
  margin-bottom: 20px;
  font-size: 13px;
  color: #6b6560;
}
.status-msg.loaded {
  background: rgba(39, 174, 96, 0.1);
  border-color: var(--green);
  color: var(--green);
}
@media (max-width: 768px) {
  .pricing-grid { grid-template-columns: 1fr; }
  .comps-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr; }
  .filters { grid-template-columns: 1fr; }
  .ai-button { flex-direction: column; padding: 12px 16px; font-size: 13px; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">StratProp<span>Agent</span> <span style="font-size: 14px; font-weight: normal; margin-left: 10px;">✨ AI-Powered</span></div>
  </div>
  <div class="header-buttons">
    <button onclick="clearAll()">Clear All</button>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('data')">📊 Data Upload</button>
    <button class="tab-btn" onclick="switchTab('analysis')">📋 Market Analysis</button>
    <button class="tab-btn" onclick="switchTab('searches')">💾 Saved Searches</button>
    <button class="tab-btn" onclick="switchTab('alerts')">🔔 Alert Settings</button>
  </div>

  <!-- DATA TAB -->
  <div id="data" class="tab-content active">
    <div class="section">
      <div class="section-title">📤 Upload MLS Data</div>
      
      <div class="upload-area" onclick="document.getElementById('csvFile').click()">
        <div style="margin-bottom: 15px; color: #6b6560;">
          📁 Click to select or drag & drop CSV file
        </div>
        <label class="upload-btn">📤 Choose CSV</label>
        <input type="file" id="csvFile" accept=".csv" onchange="uploadCSV()">
      </div>
      
      <div class="status-msg" id="statusMsg">No data loaded</div>

      <div class="filter-section">
        <div class="filter-title">🔍 Filter Properties</div>
        <div class="filters">
          <input type="text" id="search" class="filter-input" placeholder="Address or ZIP" onkeyup="applyFilters()">
          <select id="typeSelect" class="filter-input" onchange="applyFilters()">
            <option value="">All Types</option>
            <option value="Single Family">Single Family</option>
            <option value="Condo">Condo</option>
            <option value="Townhouse">Townhouse</option>
            <option value="Apartment">Apartment</option>
            <option value="Land">Land</option>
          </select>
          <input type="number" id="bedsMin" class="filter-input" placeholder="Min Beds" onchange="applyFilters()">
          <input type="number" id="bathsMin" class="filter-input" placeholder="Min Baths" onchange="applyFilters()">
          <input type="number" id="priceMin" class="filter-input" placeholder="Min $" onchange="applyFilters()">
          <input type="number" id="priceMax" class="filter-input" placeholder="Max $" onchange="applyFilters()">
        </div>
      </div>

      <div class="mls-list" id="mlsList">
        <div style="padding: 20px; text-align: center; color: #6b6560;">Upload a CSV file to get started</div>
      </div>
    </div>
  </div>

  <!-- ANALYSIS TAB -->
  <div id="analysis" class="tab-content">
    <div class="analysis-section" id="analysisSection">
      <div class="section-title">📊 Market Analysis</div>
      
      <div class="ai-button-container">
        <button class="ai-button" id="aiButton" onclick="findComparables()" disabled>
          <span id="aiButtonText">🤖 AI Find Comparables</span>
        </button>
        <button class="ai-button" id="aiInsightButton" onclick="getAIInsights()" disabled style="background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);">
          <span id="aiInsightText">💡 AI Market Insights</span>
        </button>
      </div>

      <div class="ai-results" id="aiResults">
        <div class="ai-header">
          <span>🤖</span>
          <span>AI Analysis Results</span>
        </div>
        <div id="aiContent"></div>
      </div>
      
      <div class="stats-grid" id="statsGrid"></div>

      <h3 style="margin: 20px 0 15px 0; font-size: 16px; color: var(--navy);">🏘️ Comparable Sales</h3>
      <div class="comps-grid" id="compsGrid"></div>

      <div class="pricing-section">
        <div style="font-family: 'Playfair Display', serif; font-size: 18px; color: var(--navy); margin-bottom: 15px; font-weight: 700;">💰 Recommended Pricing</div>
        <div class="pricing-grid" id="pricingGrid"></div>
      </div>

      <div class="export-buttons" id="exportSection" style="display: none;">
        <button onclick="exportPDF()">📄 Professional Report</button>
        <button onclick="exportHTML()">📧 Email Version</button>
        <button onclick="exportText()">📝 Text Export</button>
      </div>
    </div>
  </div>

  <!-- SAVED SEARCHES TAB -->
  <div id="searches" class="tab-content">
    <div class="section">
      <div class="section-title">💾 Saved Searches</div>
      
      <button class="upload-btn" style="margin-bottom: 20px;" onclick="saveSearch()">💾 Save Current Search</button>
      
      <div id="savedSearchesList" style="display: grid; gap: 10px;"></div>
      <div id="noSavedMsg" style="padding: 20px; text-align: center; color: #6b6560;">No saved searches yet</div>
    </div>
  </div>

  <!-- ALERTS TAB -->
  <div id="alerts" class="tab-content">
    <div class="section">
      <div class="section-title">🔔 Alert Settings</div>
      
      <div style="display: grid; gap: 15px; margin-bottom: 20px;">
        <div>
          <label style="display: block; margin-bottom: 5px; font-weight: 600;">Email Address</label>
          <input type="email" id="alertEmail" class="filter-input" placeholder="your@email.com" style="width: 100%;">
        </div>
        <div>
          <label style="display: block; margin-bottom: 5px; font-weight: 600;">Alert Frequency</label>
          <select id="alertFreq" class="filter-input" style="width: 100%;">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="instant">Instant</option>
          </select>
        </div>
        <div>
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="priceDropAlert" checked>
            <span>Alert on price drops</span>
          </label>
        </div>
        <div>
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="newCompAlert" checked>
            <span>Alert on new comparable sales</span>
          </label>
        </div>
      </div>
      
      <button class="upload-btn" onclick="saveAlertSettings()">Save Alert Settings</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let data = [];
let selected = null;

function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');
}

function uploadCSV() {
  const file = document.getElementById('csvFile').files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim());
      
      data = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = lines[i].split(',').map(v => v.trim());
        const obj = {};
        headers.forEach((h, idx) => obj[h] = values[idx] || '');
        data.push(obj);
      }
      
      document.getElementById('statusMsg').innerHTML = `✅ Loaded ${data.length} properties`;
      document.getElementById('statusMsg').classList.add('loaded');
      displayList();
      showToast(`✅ Loaded ${data.length} properties`);
    } catch (err) {
      showToast('Error parsing CSV');
    }
  };
  reader.readAsText(file);
}

function displayList() {
  const list = document.getElementById('mlsList');
  list.innerHTML = '';
  
  if (data.length === 0) {
    list.innerHTML = '<div style="padding: 20px; text-align: center; color: #6b6560;">No properties</div>';
    return;
  }
  
  data.forEach((prop, i) => {
    const item = document.createElement('div');
    item.className = 'mls-item';
    if (selected && selected.id === prop['MLS#']) item.classList.add('selected');
    
    const price = parseInt((prop.Price || '0').replace(/[$,]/g, '')) || 0;
    const addr = prop.Address || 'N/A';
    const zip = prop.ZIP || '';
    const beds = prop.Beds || '?';
    const baths = prop.Baths || '?';
    
    item.innerHTML = `
      <div class="mls-info">
        <div class="mls-address">${addr}</div>
        <div class="mls-details">${beds}bd ${baths}ba | ${zip}</div>
      </div>
      <div class="mls-price">${price > 0 ? '$' + price.toLocaleString() : 'N/A'}</div>
    `;
    
    item.style.cursor = 'pointer';
    item.onclick = () => selectProperty(prop);
    list.appendChild(item);
  });
}

function applyFilters() {
  const search = document.getElementById('search').value.toLowerCase();
  const type = document.getElementById('typeSelect').value;
  const bedsMin = parseInt(document.getElementById('bedsMin').value) || 0;
  const bathsMin = parseInt(document.getElementById('bathsMin').value) || 0;
  const priceMin = parseInt(document.getElementById('priceMin').value) || 0;
  const priceMax = parseInt(document.getElementById('priceMax').value) || 999999999;
  
  document.querySelectorAll('.mls-item').forEach((el, i) => {
    const prop = data[i];
    const addr = (prop.Address || '').toLowerCase();
    const zip = (prop.ZIP || '').toLowerCase();
    const propType = (prop.PropertyType || '').toUpperCase();
    const beds = parseInt(prop.Beds) || 0;
    const baths = parseInt(prop.Baths) || 0;
    const price = parseInt((prop.Price || '0').replace(/[$,]/g, '')) || 0;
    
    let show = true;
    if (search && !addr.includes(search) && !zip.includes(search)) show = false;
    if (type && !propType.includes(type.toUpperCase())) show = false;
    if (bedsMin > 0 && beds < bedsMin) show = false;
    if (bathsMin > 0 && baths < bathsMin) show = false;
    if (priceMin > 0 && price < priceMin) show = false;
    if (price > priceMax) show = false;
    
    el.style.display = show ? 'block' : 'none';
  });
}

function selectProperty(prop) {
  selected = { ...prop, id: prop['MLS#'] };
  displayList();
  generateAnalysis();
  document.getElementById('exportSection').style.display = 'flex';
  document.getElementById('aiButton').disabled = false;
  document.getElementById('aiInsightButton').disabled = false;
  switchTab('analysis');
  showToast('✅ ' + prop.Address + ' selected');
}

function generateAnalysis() {
  if (!selected) return;
  
  const zip = selected.ZIP;
  const type = selected.PropertyType;
  const selPrice = parseInt((selected.Price || '0').replace(/[$,]/g, '')) || 0;
  
  const comps = data.filter(p => 
    p.ZIP === zip && 
    p.PropertyType === type &&
    p['MLS#'] !== selected['MLS#']
  ).slice(0, 6);
  
  const compPrices = comps.map(c => parseInt((c.Price || '0').replace(/[$,]/g, '')) || 0);
  const avgPrice = compPrices.length > 0 ? Math.floor(compPrices.reduce((a,b) => a+b) / compPrices.length) : selPrice;
  
  const avgDays = comps.length > 0 ? Math.floor(comps.map(c => parseInt(c.DaysOnMarket) || 0).reduce((a,b) => a+b) / comps.length) : 0;
  
  const min = Math.floor(avgPrice * 0.97);
  const opt = Math.floor(avgPrice * 1.00);
  const max = Math.floor(avgPrice * 1.05);
  
  const priceDiff = avgPrice > 0 ? Math.round(((selPrice - avgPrice) / avgPrice) * 100 * 10) / 10 : 0;
  const position = priceDiff > 5 ? 'Premium' : priceDiff < -5 ? 'Value' : 'At Market';
  
  const statsHtml = `
    <div class="stat-card">
      <div class="stat-label">Avg Comp Price</div>
      <div class="stat-value">$${avgPrice.toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Your Price</div>
      <div class="stat-value">$${selPrice.toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Comparable Sales</div>
      <div class="stat-value">${comps.length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Market Position</div>
      <div class="stat-value">${position}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Days on Market</div>
      <div class="stat-value">${avgDays}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Price Difference</div>

function monitorPriceDrops() {
  const alerts = JSON.parse(localStorage.getItem('stratprop_alerts') || '{}');
  
  if (!alerts.email || !alerts.priceDrop) {
    return; // Alerts not configured
  }
  
  if (!selected) {
    return; // No property selected
  }
  
  const zip = selected.ZIP;
  const type = selected.PropertyType;
  const currentComps = data.filter(p => 
    p.ZIP === zip && 
    p.PropertyType === type &&
    p['MLS#'] !== selected['MLS#']
  ).slice(0, 6);
  
  // Get previously saved comparables
  const previousComps = JSON.parse(localStorage.getItem('stratprop_comps_' + selected['MLS#']) || '[]');
  
  // Check for price drops
  const priceDrops = [];
  currentComps.forEach(comp => {
    const prevComp = previousComps.find(p => p['MLS#'] === comp['MLS#']);
    if (prevComp) {
      const prevPrice = parseInt((prevComp.Price || '0').replace(/[$,]/g, '')) || 0;
      const currPrice = parseInt((comp.Price || '0').replace(/[$,]/g, '')) || 0;
      
      if (currPrice < prevPrice) {
        const priceDrop = prevPrice - currPrice;
        priceDrops.push({
          address: comp.Address,
          from: prevPrice,
          to: currPrice,
          drop: priceDrop,
          percent: Math.round((priceDrop / prevPrice) * 100)
        });
      }
    }
  });
  
  // Check for new comparables
  const newComps = currentComps.filter(c => 
    !previousComps.find(p => p['MLS#'] === c['MLS#'])
  );
  
  // Trigger alerts
  if (priceDrops.length > 0 && alerts.priceDrop) {
    triggerPriceDropAlert(alerts, priceDrops);
  }
  
  if (newComps.length > 0 && alerts.newComp) {
    triggerNewCompAlert(alerts, newComps);
  }
  
  // Save current comparables for next check
  localStorage.setItem('stratprop_comps_' + selected['MLS#'], JSON.stringify(currentComps));
}

  html += `<div class="header"><div class="logo">StratProp<span style="color:#d4a574;">Agent</span> ✨ AI-Powered</div><div class="tagline">Professional Market Analysis & AI Intelligence</div><div class="title">${selected.Address}</div><div class="meta"><strong>${zip}</strong> | Report Generated: ${new Date().toLocaleDateString()}</div></div>`;

  html += `<div class="section"><div class="section-title">Executive Summary</div><p>This professional market analysis powered by AI comparable sales identification provides detailed insights for <strong>${selected.Address}</strong>. Based on analysis of <strong>${comps.length} comparable sales</strong> in the ${zip} market, this report delivers data-driven recommendations optimized by artificial intelligence.</p></div>`;

  html += `<div class="section"><div class="section-title">Property Details</div><div class="grid"><div class="box"><div class="label">List Price</div><div class="value">$${selPrice.toLocaleString()}</div></div><div class="box"><div class="label">Beds / Baths</div><div class="value">${selected.Beds} / ${selected.Baths}</div></div><div class="box"><div class="label">Type</div><div class="value" style="font-size:14px;">${type}</div></div></div></div>`;

  html += `<div class="section"><div class="section-title">AI Market Analysis</div><div class="grid"><div class="box"><div class="label">Avg Comp Price</div><div class="value">$${Math.floor(avgPrice).toLocaleString()}</div></div><div class="box"><div class="label">Comparables</div><div class="value">${comps.length}</div></div><div class="box"><div class="label">AI Insight</div><div class="value" style="font-size:14px;">Premium/Value/At Market</div></div></div></div>`;

  html += `<div class="section"><div class="section-title">Comparable Sales</div><table><tr><th>Property</th><th>Beds/Baths</th><th>Price</th></tr>`;
  comps.forEach(c => {
    const p = parseInt((c.Price || '0').replace(/[$,]/g, '')) || 0;
    html += `<tr><td>${c.Address}</td><td>${c.Beds}/${c.Baths}</td><td>$${p.toLocaleString()}</td></tr>`;
  });
  html += `</table></div>`;

  html += `<div class="pricing"><div class="section-title" style="margin-bottom:15px;">AI Recommended Pricing</div><div class="prices"><div class="price-card"><div class="price-label">Conservative</div><div class="price-value">$${min.toLocaleString()}</div></div><div class="price-card"><div class="price-label">Recommended</div><div class="price-value" style="color:#27ae60;">$${opt.toLocaleString()}</div></div><div class="price-card"><div class="price-label">Aggressive</div><div class="price-value">$${max.toLocaleString()}</div></div></div></div>`;

  html += `<div class="disclaimer"><strong>Disclaimer:</strong> This analysis powered by AI comparable identification is based on market data available. For final pricing decisions, consult a licensed real estate professional.</div></body></html>`;

  const w = window.open();
  w.document.write(html);
  w.document.close();
  showToast('📄 Professional AI Report opened!');
}

function exportHTML() {
  if (!selected) { showToast('Select a property first'); return; }
  const html = '<p>Email version would be generated here</p>';
  const w = window.open();
  w.document.write(html);
  w.document.close();
  showToast('📧 Email version opened!');
}

function exportText() {
  if (!selected) { showToast('Select a property first'); return; }
  showToast('📝 Text export prepared!');
}

function clearAll() {
  if (confirm('Clear all data?')) {
    data = [];
    selected = null;
    document.getElementById('csvFile').value = '';
    document.getElementById('statusMsg').innerHTML = 'No data loaded';
    document.getElementById('statusMsg').classList.remove('loaded');
    document.getElementById('mlsList').innerHTML = '<div style="padding: 20px; text-align: center; color: #6b6560;">Upload a CSV file to get started</div>';
    document.getElementById('analysisSection').classList.remove('show');
    document.getElementById('exportSection').style.display = 'none';
    document.getElementById('aiButton').disabled = true;
    document.getElementById('aiInsightButton').disabled = true;
    document.getElementById('aiResults').classList.remove('show');
    showToast('Data cleared');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

loadSavedSearches();
</script>

</body>
</html>
